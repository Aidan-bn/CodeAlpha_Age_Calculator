<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Age Calculator</title>
  </head>
  <body>
    <video
      src="./assets/bg-video.mp4"
      type="video/mp4"
      class="video"
      autoplay
      loop
    ></video>
    <main>
      <h1>Age Calculator</h1>
      <form action="">
        <label for="birth-date">
          Select your birth date:
          <input type="date" id="birth-date" placeholder="Select date" />
        </label>
        <button type="submit" id="btn-calculate">Calculate Age</button>
        <label for="calculated-age"> ---------------- </label>
        <label id="age"> </label>
      </form>
    </main>
    <div class="bottom">
      <a href="https://www.pexels.com/search/videos/website%20background/"
        ><img src="./assets/link.svg" alt="link" class="link-img" />Background
        clip by</a
      >
    </div>

    <script src="./script.js"></script>
  </body>
</html>
